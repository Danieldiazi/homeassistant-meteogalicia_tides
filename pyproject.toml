[project]
name = "homeassistant-meteogalicia-tides-tests"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
test = [
  "MeteoGalicia-API==0.1.2",
  "pytest-homeassistant-custom-component==0.13.316",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.meteogalicia_tides --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
prerelease = "allow"
