name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements_build.lock
            requirements_test.lock

      - name: Install locked build tools
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          -r requirements_build.lock

      - name: Install test dependencies
        # These two pinned test dependencies publish only sdists. Their hashes
        # and build tools are locked; all other packages must provide wheels.
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --no-binary mock-open,pyric --no-build-isolation
          -r requirements_test.lock

      - name: Check dependency consistency
        run: |
          python scripts/check_test_environment.py
          python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests scripts

      - name: Validate JSON
        run: >-
          python -c "import json, pathlib;
          [json.loads(path.read_text()) for path in pathlib.Path('.').rglob('*.json')]"

      - name: Run Ruff checks
        run: ruff check .

      - name: Run unit tests
        run: >-
          pytest -q
          --cov=custom_components/meteogalicia_tides
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

