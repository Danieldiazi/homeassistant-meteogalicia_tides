[project]
name = "homeassistant-meteogalicia-tides-tests"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
test = [
  "MeteoGalicia-API==0.1.2",
  "pytest-homeassistant-custom-component==0.13.205",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
prerelease = "allow"
