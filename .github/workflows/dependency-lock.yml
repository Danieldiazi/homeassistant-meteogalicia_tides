name: Refresh dependency lock

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/dependency-lock.yml

concurrency:
  group: dependency-lock-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Upgrade, test and commit uv.lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Upgrade the lock file
        run: uv lock --upgrade
      - name: Check whether the lock changed
        id: changes
        run: |
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: uv run --frozen --group test ruff check .
      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: uv run --frozen --group test pytest -v
      - name: Commit the verified lock file
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Update locked dependencies"
          git push origin HEAD:main
