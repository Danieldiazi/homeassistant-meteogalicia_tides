name: Release

on:
  push:
    branches: ["publish/*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish HACS release
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release_tag = os.environ["GITHUB_REF_NAME"].removeprefix("publish/")
          manifest_path = Path("custom_components/meteogalicia_tides/manifest.json")
          manifest_version = json.loads(manifest_path.read_text(encoding="utf-8"))["version"]

          def normalized(version):
              return tuple(
                  int(part) if part.isdigit() else part
                  for part in version.removeprefix("v").split(".")
              )

          if normalized(release_tag) != normalized(manifest_version):
              raise SystemExit(
                  f"Manifest version {manifest_version} does not match release {release_tag}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={release_tag}\n")
          PY

      - name: Create HACS zip
        run: |
          cd custom_components/meteogalicia_tides
          zip ../../homeassistant-meteogalicia_tides.zip -r ./

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: homeassistant-meteogalicia_tides.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
