name: Bug report
description: Report a problem with MeteoGalicia Tides
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before reporting, update to the latest release and download diagnostics from the integration page.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the downloaded diagnostics file. Review it before sharing.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I am using UI configuration, not legacy YAML.
          required: true
