name: Release

on:
  push:
    branches: ["publish/*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish HACS release
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: release
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#publish/}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/meteogalicia_tides/manifest.json"))["version"])')"
          if [[ "${release_tag#v}" != "$manifest_version" ]]; then
            echo "Manifest version $manifest_version does not match release $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create HACS zip
        run: |
          cd custom_components/meteogalicia_tides
          zip ../../homeassistant-meteogalicia_tides.zip -r ./

      - name: Create GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: homeassistant-meteogalicia_tides.zip
          generate_release_notes: true
